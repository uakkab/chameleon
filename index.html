<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Ladder - Daily Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .puzzle-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .word-display {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .word {
            display: flex;
            gap: 6px;
        }

        .word-letter {
            width: 50px;
            height: 50px;
            border: 2px solid #667eea;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            background: #f0f3ff;
        }

        .arrow {
            color: #999;
            font-size: 24px;
            font-weight: bold;
        }

        .moves-info {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .game-board {
            margin: 20px 0;
        }

        .step {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .letter-boxes {
            display: flex;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .letter-box {
            width: 60px;
            height: 60px;
            border: 2px solid #d3d6da;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            background: white;
            transition: all 0.2s;
        }

        .letter-box:focus {
            outline: none;
            border-color: #667eea;
            border-width: 3px;
        }

        .letter-box.filled {
            border-color: #878a8c;
        }

        .letter-box.correct {
            background: #6aaa64;
            border-color: #6aaa64;
            color: white;
        }

        .letter-box.incorrect {
            background: #c9b458;
            border-color: #c9b458;
            color: white;
        }

        .letter-box.error {
            background: #787c7e;
            border-color: #787c7e;
            color: white;
        }

        .letter-box:disabled {
            cursor: not-allowed;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.primary {
            background: #667eea;
            color: white;
        }

        button.primary:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #6c757d;
            color: white;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .rules {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 13px;
            color: #856404;
        }

        .rules h3 {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .rules ul {
            margin-left: 20px;
        }

        .rules li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪜 Word Ladder</h1>
        <div class="subtitle">Daily Puzzle - One puzzle per day!</div>

        <div class="puzzle-info">
            <div class="word-display">
                <div class="word" id="startWord">COLD</div>
                <div class="arrow">→</div>
                <div class="word" id="endWord">WARM</div>
            </div>
            <div class="moves-info">Transform the word in exactly <span id="maxMoves">5</span> steps</div>
        </div>

        <div class="message" id="message"></div>

        <div class="game-board" id="gameBoard"></div>

        <div class="buttons">
            <button class="primary" id="checkBtn">Check Solution</button>
            <button class="secondary" id="resetBtn">Reset</button>
        </div>

        <div class="stats" id="stats"></div>

        <div class="rules">
            <h3>Rules:</h3>
            <ul>
                <li>Change exactly one letter per step</li>
                <li>Each step must be a valid word</li>
                <li>Reach the end word in exactly the required number of moves</li>
                <li>New puzzle available daily at midnight!</li>
            </ul>
        </div>
    </div>

    <script>
        // Word dictionary for validation (common 4-letter words)
        const VALID_WORDS = new Set([
            'COLD', 'WARM', 'CORD', 'WORD', 'WORM', 'CORE', 'WORE', 'WARE', 'CARE',
            'CART', 'CAST', 'CASE', 'CAGE', 'PAGE', 'PALE', 'PANE', 'PINE', 'FINE',
            'FIRE', 'FARE', 'FACE', 'PACE', 'RACE', 'RICE', 'RICH', 'RIPE', 'RIDE',
            'HIDE', 'HIKE', 'LIKE', 'LIFE', 'LIFT', 'GIFT', 'GIRT', 'GIRL', 'GULL',
            'BULL', 'BULL', 'BALL', 'TALL', 'TALE', 'TAKE', 'MAKE', 'MADE', 'MATE',
            'MOTE', 'MORE', 'GORE', 'GONE', 'BONE', 'BORE', 'BOLD', 'GOLD', 'GILD',
            'MILD', 'MILE', 'MOLE', 'POLE', 'POLL', 'POOL', 'COOL', 'COAL', 'FOAL',
            'FOAM', 'ROAM', 'ROAD', 'TOAD', 'TOLD', 'TOLL', 'TOOL', 'FOOL', 'FOOD',
            'FORD', 'FORM', 'WORM', 'WORK', 'CORK', 'PORK', 'PORE', 'PORK', 'PORT',
            'SORT', 'SORE', 'SURE', 'SURF', 'TURF', 'TURN', 'TORN', 'CORN', 'BORN',
            'BARN', 'BARD', 'CARD', 'WARD', 'WAND', 'WANT', 'PANT', 'PINT', 'LINT',
            'LINE', 'LONE', 'LOVE', 'DOVE', 'DOLE', 'DOME', 'HOME', 'HOPE', 'ROPE',
            'ROBE', 'RODE', 'ROLE', 'ROLL', 'DOLL', 'DULL', 'DULL', 'DUNK', 'BUNK',
            'BANK', 'BANE', 'BAND', 'LAND', 'LANE', 'SANE', 'SAND', 'SAID', 'SAIL',
            'TAIL', 'FAIL', 'FALL', 'GALL', 'HALL', 'HALO', 'HALT', 'MALT', 'MALL',
            'MALL', 'CALL', 'CALM', 'BALM', 'BALD', 'BILE', 'BIKE', 'BITE', 'SITE',
            'SIRE', 'SIDE', 'TIDE', 'TIED', 'TIER', 'PIER', 'PIES', 'LIES', 'DIES',
            'DIEM', 'DIRE', 'WIRE', 'WIDE', 'WADE', 'WAVE', 'WAVY', 'NAVY', 'NAVE',
            'SAVE', 'SAGE', 'SAME', 'GAME', 'GATE', 'LATE', 'FATE', 'HATE', 'HAVE',
            'CAVE', 'GAVE', 'GAZE', 'DAZE', 'DATE', 'DARE', 'HARE', 'HARD', 'HARM'
        ]);

        // Daily puzzles (start word, end word, number of moves)
        const PUZZLES = [
            { start: 'COLD', end: 'WARM', moves: 4, solution: ['CORD', 'WORD', 'WORM', 'WARM'] },
            { start: 'LOVE', end: 'HATE', moves: 4, solution: ['DOVE', 'DOTE', 'DATE', 'HATE'] },
            { start: 'FIRE', end: 'COOL', moves: 5, solution: ['FORE', 'CORE', 'CORK', 'COOK', 'COOL'] },
            { start: 'LIFE', end: 'DEAD', moves: 6, solution: ['LIKE', 'DIKE', 'DIKE', 'DIRE', 'SIRE', 'SIDE'] },
            { start: 'HEAD', end: 'TAIL', moves: 5, solution: ['HEAL', 'TEAL', 'TELL', 'TALL', 'TAIL'] },
            { start: 'COOL', end: 'WARM', moves: 5, solution: ['COAL', 'COAT', 'CART', 'WARD', 'WARM'] },
            { start: 'PALE', end: 'DARK', moves: 6, solution: ['PANE', 'BANE', 'BANE', 'BARK', 'DARK', 'DARK'] },
        ];

        class WordLadderGame {
            constructor() {
                this.puzzle = this.getDailyPuzzle();
                this.attempts = [];
                this.loadState();
                this.init();
            }

            getDailyPuzzle() {
                const today = new Date();
                const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
                const puzzleIndex = dayOfYear % PUZZLES.length;
                return PUZZLES[puzzleIndex];
            }

            init() {
                this.renderWordBoxes('startWord', this.puzzle.start);
                this.renderWordBoxes('endWord', this.puzzle.end);
                document.getElementById('maxMoves').textContent = this.puzzle.moves;

                this.renderBoard();
                this.updateStats();

                document.getElementById('checkBtn').addEventListener('click', () => this.checkSolution());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
            }

            renderWordBoxes(elementId, word) {
                const container = document.getElementById(elementId);
                container.innerHTML = '';
                for (let i = 0; i < word.length; i++) {
                    const letterBox = document.createElement('div');
                    letterBox.className = 'word-letter';
                    letterBox.textContent = word[i];
                    container.appendChild(letterBox);
                }
            }

            renderBoard() {
                const board = document.getElementById('gameBoard');
                board.innerHTML = '';
                const wordLength = this.puzzle.start.length;

                for (let i = 0; i < this.puzzle.moves; i++) {
                    const step = document.createElement('div');
                    step.className = 'step';

                    const stepNumber = document.createElement('div');
                    stepNumber.className = 'step-number';
                    stepNumber.textContent = i + 1;

                    const letterBoxes = document.createElement('div');
                    letterBoxes.className = 'letter-boxes';

                    // Create individual letter boxes
                    for (let j = 0; j < wordLength; j++) {
                        const box = document.createElement('input');
                        box.type = 'text';
                        box.className = 'letter-box';
                        box.maxLength = 1;
                        box.id = `box${i}-${j}`;

                        // Pre-fill if we have saved attempts
                        if (this.attempts[i] && this.attempts[i][j]) {
                            box.value = this.attempts[i][j];
                            box.classList.add('filled');
                        }

                        // Handle input
                        box.addEventListener('input', (e) => {
                            const value = e.target.value.toUpperCase();
                            e.target.value = value;

                            if (value) {
                                e.target.classList.add('filled');
                                // Move to next box
                                if (j < wordLength - 1) {
                                    document.getElementById(`box${i}-${j + 1}`).focus();
                                } else if (i < this.puzzle.moves - 1) {
                                    // Move to first box of next word
                                    document.getElementById(`box${i + 1}-0`).focus();
                                }
                            }
                        });

                        // Handle backspace
                        box.addEventListener('keydown', (e) => {
                            if (e.key === 'Backspace' && !e.target.value && j > 0) {
                                // Move to previous box and clear it
                                const prevBox = document.getElementById(`box${i}-${j - 1}`);
                                prevBox.focus();
                                prevBox.value = '';
                                prevBox.classList.remove('filled');
                            }
                        });

                        letterBoxes.appendChild(box);
                    }

                    step.appendChild(stepNumber);
                    step.appendChild(letterBoxes);
                    board.appendChild(step);
                }

                // Focus first box
                document.getElementById('box0-0').focus();
            }

            checkSolution() {
                this.attempts = [];
                let allValid = true;
                let message = '';
                const wordLength = this.puzzle.start.length;

                // Collect all attempts from letter boxes
                for (let i = 0; i < this.puzzle.moves; i++) {
                    let word = '';
                    for (let j = 0; j < wordLength; j++) {
                        const box = document.getElementById(`box${i}-${j}`);
                        word += box.value.toUpperCase();
                    }
                    this.attempts.push(word);
                }

                // Validate each step
                let prevWord = this.puzzle.start;
                for (let i = 0; i < this.puzzle.moves; i++) {
                    const word = this.attempts[i];
                    let stepValid = true;

                    // Reset all boxes in this step
                    for (let j = 0; j < wordLength; j++) {
                        const box = document.getElementById(`box${i}-${j}`);
                        box.classList.remove('correct', 'incorrect', 'error');
                    }

                    if (!word || word.length !== wordLength) {
                        allValid = false;
                        stepValid = false;
                        message = 'Please fill in all steps!';
                        // Mark incomplete boxes
                        for (let j = 0; j < wordLength; j++) {
                            const box = document.getElementById(`box${i}-${j}`);
                            if (!box.value) {
                                box.classList.add('error');
                            }
                        }
                        continue;
                    }

                    // Check if valid word
                    if (!VALID_WORDS.has(word)) {
                        allValid = false;
                        stepValid = false;
                        message = `"${word}" is not a valid word!`;
                        for (let j = 0; j < wordLength; j++) {
                            document.getElementById(`box${i}-${j}`).classList.add('incorrect');
                        }
                        continue;
                    }

                    // Check if only one letter changed
                    if (!this.isOneLetterDifferent(prevWord, word)) {
                        allValid = false;
                        stepValid = false;
                        message = `You must change exactly one letter from ${prevWord} to ${word}!`;
                        for (let j = 0; j < wordLength; j++) {
                            document.getElementById(`box${i}-${j}`).classList.add('incorrect');
                        }
                        continue;
                    }

                    // Mark all boxes as correct for this step
                    if (stepValid) {
                        for (let j = 0; j < wordLength; j++) {
                            document.getElementById(`box${i}-${j}`).classList.add('correct');
                        }
                    }

                    prevWord = word;
                }

                // Check if final word matches
                if (allValid && this.attempts[this.puzzle.moves - 1] !== this.puzzle.end) {
                    allValid = false;
                    message = `Last word must be ${this.puzzle.end}!`;
                    const lastStepIndex = this.puzzle.moves - 1;
                    for (let j = 0; j < wordLength; j++) {
                        document.getElementById(`box${lastStepIndex}-${j}`).classList.remove('correct');
                        document.getElementById(`box${lastStepIndex}-${j}`).classList.add('incorrect');
                    }
                }

                // Display result
                const messageEl = document.getElementById('message');
                messageEl.className = 'message';

                if (allValid) {
                    messageEl.classList.add('success');
                    messageEl.textContent = '🎉 Congratulations! You solved the puzzle!';
                    this.saveWin();
                    this.disableInputs();
                } else {
                    messageEl.classList.add('error');
                    messageEl.textContent = message || 'Solution is incorrect. Keep trying!';
                }

                this.saveState();
            }

            isOneLetterDifferent(word1, word2) {
                if (word1.length !== word2.length) return false;

                let differences = 0;
                for (let i = 0; i < word1.length; i++) {
                    if (word1[i] !== word2[i]) {
                        differences++;
                    }
                }

                return differences === 1;
            }

            disableInputs() {
                const wordLength = this.puzzle.start.length;
                for (let i = 0; i < this.puzzle.moves; i++) {
                    for (let j = 0; j < wordLength; j++) {
                        document.getElementById(`box${i}-${j}`).disabled = true;
                    }
                }
                document.getElementById('checkBtn').disabled = true;
            }

            reset() {
                this.attempts = [];
                this.renderBoard();

                const messageEl = document.getElementById('message');
                messageEl.className = 'message';
                messageEl.textContent = '';

                document.getElementById('checkBtn').disabled = false;
                this.saveState();
            }

            saveState() {
                const state = {
                    date: this.getToday(),
                    attempts: this.attempts,
                    puzzle: this.puzzle
                };
                localStorage.setItem('wordLadderState', JSON.stringify(state));
            }

            loadState() {
                const saved = localStorage.getItem('wordLadderState');
                if (saved) {
                    const state = JSON.parse(saved);
                    if (state.date === this.getToday() &&
                        JSON.stringify(state.puzzle) === JSON.stringify(this.puzzle)) {
                        this.attempts = state.attempts || [];
                    }
                }
            }

            saveWin() {
                const stats = this.getStats();
                stats.wins++;
                stats.streak++;
                stats.lastWin = this.getToday();
                localStorage.setItem('wordLadderStats', JSON.stringify(stats));
                this.updateStats();
            }

            getStats() {
                const saved = localStorage.getItem('wordLadderStats');
                if (saved) {
                    const stats = JSON.parse(saved);
                    if (stats.lastWin !== this.getYesterday()) {
                        stats.streak = 0;
                    }
                    return stats;
                }
                return { wins: 0, streak: 0, lastWin: null };
            }

            updateStats() {
                const stats = this.getStats();
                const statsEl = document.getElementById('stats');
                statsEl.textContent = `Wins: ${stats.wins} | Current Streak: ${stats.streak}`;
            }

            getToday() {
                return new Date().toISOString().split('T')[0];
            }

            getYesterday() {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                return yesterday.toISOString().split('T')[0];
            }
        }

        // Initialize game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new WordLadderGame();
        });
    </script>
</body>
</html>
